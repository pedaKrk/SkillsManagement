<div *ngIf="reply" class="reply-card">
  <div class="reply-header">
    <span class="reply-author">{{ reply.authorName }}</span>
    <span class="reply-date">{{ formatDate(reply.createdAt) }}</span>
  </div>
  
  <!-- Edit form for reply -->
  <div *ngIf="editing" class="edit-reply-form">
    <textarea
      [(ngModel)]="editText"
      class="form-control"
      rows="3"
      [placeholder]="'COMMON.ENTER_TEXT' | translate"
    ></textarea>
    <div class="edit-actions">
      <button
        class="btn btn-primary btn-sm"
        (click)="saveEdit()"
        [disabled]="!editText.trim() || isLoading"
      >
        {{ 'COMMON.SAVE' | translate }}
      </button>
      <button
        class="btn btn-secondary btn-sm"
        (click)="cancelEdit()"
        [disabled]="isLoading"
      >
        {{ 'COMMON.CANCEL' | translate }}
      </button>
    </div>
  </div>
  
  <!-- Display reply text (when not editing) -->
  <div *ngIf="!editing" class="reply-text" [class.expanded]="isExpanded" [class.rich-text]="reply.isRichText">
    <!-- Rich Text Display -->
    <div 
      *ngIf="reply.isRichText" 
      [innerHTML]="getDisplayText(reply.content || reply.text, isExpanded, true)"
      class="rich-text-content"
    ></div>
    <!-- Plain Text Display -->
    <span *ngIf="!reply.isRichText">
      {{ getDisplayText(reply.text || reply.content, isExpanded, false) }}
    </span>
    <button
      *ngIf="isTextTooLong(reply.content || reply.text)"
      class="text-expand-btn"
      (click)="toggleExpansion()"
    >
      {{ isExpanded ? ('USER.SHOW_LESS' | translate) : ('USER.SHOW_MORE' | translate) }}
    </button>
  </div>

  <!-- Attachments -->
  <div *ngIf="reply.attachments && reply.attachments.length > 0 && !editing" class="reply-attachments">
    <div class="attachments-header">
      <i class="fa fa-paperclip"></i>
      <span>{{ 'PROFILE.ATTACHMENTS' | translate }} ({{ reply.attachments.length }})</span>
    </div>
    <div class="attachments-list">
      <div *ngFor="let attachment of reply.attachments" class="attachment-item">
        <i [class]="'fa ' + getFileIconClass(attachment.mimetype)"></i>
        <span class="attachment-name">{{ attachment.originalName || attachment.filename }}</span>
        <span class="attachment-size">{{ formatFileSize(attachment.size) }}</span>
        <button
          type="button"
          class="btn-download-attachment"
          (click)="downloadAttachment(attachment)"
          [attr.aria-label]="'PROFILE.DOWNLOAD_ATTACHMENT' | translate"
          [title]="'PROFILE.DOWNLOAD_ATTACHMENT' | translate"
        >
          <i class="fa fa-download"></i>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Edit/Delete buttons for reply -->
  <div *ngIf="!editing" class="reply-actions">
    <!-- Edit button (for author only) -->
    <button
      *ngIf="isReplyAuthor()"
      class="btn-edit"
      (click)="startEdit()"
      [disabled]="isOtherEditing"
    >
      <i class="fa fa-pencil"></i> {{ 'COMMON.EDIT' | translate }}
    </button>
    <!-- Delete button (for author or admin) -->
    <button
      *ngIf="canDeleteReply()"
      class="btn-delete"
      (click)="deleteReply()"
    >
      <i class="fa fa-trash"></i> {{ 'COMMON.DELETE' | translate }}
    </button>
  </div>
</div>
